<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>규원가 해석 연습 by 조성인쌤</title>
<style>
/* 옛한글 초·중·종성 자모 결합을 지원하는 CJK 웹폰트 */
@font-face{font-family:"OldHangulCJK";src:url("https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"OldHangulCJK";src:url("https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/Korean/NotoSansCJKkr-Black.otf") format("opentype");font-weight:900;font-style:normal;font-display:swap}

:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#202b3a;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}
.app{width:min(100%,780px)}header{text-align:center;margin:0 0 25px}h1{font-size:clamp(23px,5vw,32px);margin:0 0 8px;letter-spacing:-.7px}header p{margin:0;color:#728094;font-size:14px}
.panel{background:white;border:1px solid #e7ebf2;border-radius:23px;box-shadow:0 12px 45px #172b4712;padding:clamp(22px,5vw,43px)}
.top{display:flex;align-items:center;justify-content:space-between;color:#748297;font-size:13px;font-weight:700;margin-bottom:15px}
.track{height:5px;background:#edf0f5;border-radius:20px;overflow:hidden}.bar{height:100%;background:#466cbd;transition:width .2s}
.stage{min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 0 10px}
.kicker{color:#6480ad;font-size:12px;font-weight:800;letter-spacing:2px;margin-bottom:19px}
.original{font-family:"OldHangulCJK","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-feature-settings:"ccmp" 1,"ljmo" 1,"vjmo" 1,"tjmo" 1;font-size:clamp(17px,3.7vw,24px);font-weight:900;line-height:1.75;word-break:keep-all;white-space:pre-wrap}
.reveal{border:0;background:#eaf0fb;color:#315da6;border-radius:13px;padding:13px 24px;font-size:15px;font-weight:750;cursor:pointer;margin-top:27px}
.answer{width:100%;margin-top:25px;border-top:1px solid #e9edf3;padding-top:23px;animation:up .2s ease}
.answer .translation{font-size:clamp(17px,3.5vw,21px);font-weight:400;line-height:1.8;word-break:keep-all;white-space:pre-wrap}
.answer .note{font-size:13px;line-height:1.8;color:#7b8798;margin-top:14px;text-align:left;white-space:pre-wrap}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:19px;gap:15px}
.arrow{border:1px solid #dfe5ee;background:white;border-radius:14px;min-width:60px;height:54px;color:#344963;font-size:26px;cursor:pointer}.arrow:disabled{opacity:.25;cursor:default}
.tip{color:#8b95a5;font-size:12px;text-align:center}.footer{text-align:center;margin-top:18px;font-size:12px;color:#9aa4b2}
@media(max-width:500px){.original{font-size:18px;line-height:1.8}body{padding:13px}.panel{padding:20px}.stage{min-height:340px}.nav{margin-top:13px}}
</style></head><body><main class="app">
<header><h1>규원가 해석 연습 by 조성인쌤</h1><p>원문을 읽고 뜻을 떠올린 뒤 해석을 확인하세요.</p></header>
<section class="panel"><div class="top"><span>허난설헌 · 규원가</span><span id="count"></span></div><div class="track"><div class="bar" id="bar"></div></div>
<div class="stage"><div class="kicker">원문</div><div class="original" id="original"></div><button class="reveal" id="reveal">해석 보기</button><div class="answer" id="answer" hidden><div class="translation" id="translation"></div><div class="note" id="note"></div></div></div>
</section><div class="nav"><button class="arrow" id="prev" aria-label="이전 구절">‹</button><span class="tip">← → 키 또는 좌우 스와이프로 이동</span><button class="arrow" id="next" aria-label="다음 구절">›</button></div>
<div class="footer">원문 · 해석 · 해설은 제공된 학습 자료 기준</div>
</main>
<script>
const lines=[{"original": "엇그제 저멋더니 ᄒᆞ마 어이 다 늙거니.", "translation": "엊그제 젊었더니 벌써 어찌 다 늙었는가.", "note": "*ᄒᆞ마 : 벌써"}, {"original": "소년 행락(少年行樂) 생각ᄒᆞ니 일러도 쇽절업다.", "translation": "어릴 적의 즐거움을 생각하니 말해도 속절없구나.", "note": ""}, {"original": "늘거야 설운 말ᄉᆞᆷ ᄒᆞ쟈 ᄒᆞ니 목이 멘다.", "translation": "늙어서 서러운 말을 하자 하니 목이 메는구나.", "note": ""}, {"original": "부생모육(父生母育) 신고(辛苦)ᄒᆞ야 이내 몸 길러 낼 제", "translation": "부모님이 낳아 기르며 몹시 고생하여 내 몸을 길러낼 때,", "note": "*신고ᄒᆞ야 : 몹시 고생하여"}, {"original": "공후배필(公侯配匹)은 못 바라도 군자호구(君子好逑) 원(願)ᄒᆞ더니", "translation": "공후의 배필은 못 바라더라도 군자의 좋은 짝을 원하였는데", "note": "*공후배필 : 공작과 후작처럼 고귀한 사람의 아내\n*군자호구 : 군자의 좋은 짝"}, {"original": "삼생(三生)의 원업(怨業)이오 월하(月下)의 연분(緣分)으로,", "translation": "전생의 원망스러운 업보요, 월하노인이 정해 준 인연으로", "note": "*월하 : 남녀의 혼인을 이어 주는 전설상의 신"}, {"original": "장안 유협(長安遊俠) 경박자(輕薄子)를 꿈ᄀᆞ치 만나 잇서,", "translation": "장안의 놀기 좋아하면서도 경박한 자를 꿈같이 만나서", "note": ""}, {"original": "상시(常時)의 용심(用心)ᄒᆞ기 살얼음 디듸는 ᄃᆞᆺ,", "translation": "항상 마음 쓰는 것이 살얼음을 디디는 듯", "note": ""}, {"original": "삼오 이팔(三五二八) 겨오 지나 천연여질(天然麗質) 절로 이니,", "translation": "열다섯 열여섯 겨우 지나 타고난 아름다움 저절로 일어나니", "note": ""}, {"original": "이 얼골 이 태도(態度)로 백년 기약(百年期約)ᄒᆞ얏더니,", "translation": "이 얼굴 이 태도로 평생 함께하자는 약속을 하였는데", "note": "*백년기약 : 백 년 갈 약속 = 결혼"}, {"original": "연광(年光)이 훌훌ᄒᆞ고 조물(造物)이 다시(多時)ᄒᆞ야,", "translation": "세월이 빨리 지나고 조물주가 시기가 많아", "note": ""}, {"original": "봄바람 가을 믈이 뵈오리의 북 지나듯", "translation": "봄바람과 가을 물이 베틀의 북 지나듯", "note": "*북 : 베를 짤 때 쓰는 도구의 일종으로, 빠르게 움직임"}, {"original": "설빈 화안(雪鬂花顔) 어ᄃᆡ 두고 면목 가증(面目可憎) 되거고나.", "translation": "아름다운 얼굴 어디 두고 모습이 가증스러워졌구나.", "note": ""}, {"original": "내 얼골 내 보거니 어느 님이 날 괼소냐.", "translation": "내 얼굴을 내가 보거니 어느 님이 나를 사랑할쏘냐?", "note": "*괴다 : 사랑하다"}, {"original": "스스로 참괴(慚傀)ᄒᆞ니 누구를 원망ᄒᆞ랴.", "translation": "스스로 부끄러우니 누구를 원망하리?", "note": ""}, {"original": "삼삼 오오(三三五五) 야유원(冶遊園)의 새 사람이 나단 말가.", "translation": "삼삼오오 몰려다니는 술집에 새 기생이 나타났다는 말인가?", "note": "*야유원 : 기생이 나오는 술집"}, {"original": "곳 피고 날 저믄 제 정처(定處) 업시 나가 잇어,", "translation": "꽃 피고 날 저물 제 정처 없이 나가 있어", "note": ""}, {"original": "백마 금편(白馬金鞭)으로 어ᄃᆡ 어ᄃᆡ 머므는고.", "translation": "흰 말에 금 채찍 차림으로 어디 어디 머무는고?", "note": "*백마금편 : 호사스러운 차림새"}, {"original": "원근(遠近)을 모르거니 소식(消息)이야 더옥 알랴.", "translation": "멀고 가까움을 모르는데 소식을 더욱 알겠는가?", "note": ""}, {"original": "인연(因緣)을 긋쳐신들 ᄉᆡᆼ각이야 업슬소냐.", "translation": "인연이 끊어졌다지만 생각이야 없을쏘냐?", "note": ""}, {"original": "얼골을 못 보거든 그립기나 마르려믄,", "translation": "얼굴을 못 보거든 그립지나 말았으면 좋으련만,", "note": ""}, {"original": "열두 ᄯᅢ 김도 길샤 설흔 날 지리(支離)ᄒᆞ다.", "translation": "하루 열두 시간 길기도 길구나, 한 달 서른 날은 지루하구나.", "note": "*열두 때 : 과거는 하루를 12시간으로 구분하였다."}, {"original": "옥창(玉窓)에 심ᄀᆞᆫ 매화 몃 번이나 픠여 진고.", "translation": "옥 창문 앞에 심은 매화가 몇 번이나 피었다 졌는가?", "note": ""}, {"original": "겨을 밤 차고 찬 제 자최눈 섯거 치고,", "translation": "겨울밤 차고 찰 때 진눈깨비 섞어 내리고", "note": "*자최눈 : 자취를 남기는 눈(화자의 심정을 강조하는 객관적 상관물)"}, {"original": "여름날 길고 길 제 구ᄌᆞᆫ비ᄂᆞᆫ 므스 일고.", "translation": "여름날 길고 길 때 궂은 비는 무슨 일인가?", "note": "*궂은 비 : 화자의 심정을 강조하는 객관적 상관물"}, {"original": "삼춘 화류(三春花柳) 호시절(好時節)의 경물(景物)이 시름업다.", "translation": "봄날의 꽃과 버들 좋은 시절에 경치를 보아도 아무 생각이 없구나.", "note": "*시름업다 : 아무 생각이 없다"}, {"original": "가을 ᄃᆞᆯ 방에 들고 실솔(蟋蟀)이 상(床)에 울 제,", "translation": "가을 달이 방에 비치고 귀뚜라미가 침상에서 울 때 ", "note": "*실솔 : 귀뚜라미"}, {"original": "긴 한숨 디ᄂᆞᆫ 눈물 속절업시 혬만 만타.", "translation": "긴 한숨 떨어지는 눈물, 속절없이 생각만 많구나.", "note": "*혬 : 헤아림(=생각)"}, {"original": "아마도 모진 목숨 죽기도 어려울사.", "translation": "아마도 모진 목숨 죽기도 어렵구나.", "note": ""}, {"original": "도로혀 풀쳐 혜니 이리ᄒᆞ여 어이ᄒᆞ리.", "translation": "돌이켜 풀어 헤아려 보니 이렇게 살아서 어찌하리? ", "note": "*혜니 : 헤아려 보니(=생각해 보니)"}, {"original": "청등(靑燈)을 돌라 노코 녹기금(綠綺琴) 빗기 안아,", "translation": "푸른 등불을 돌려 놓고 푸른 거문고를 비스듬이 안아", "note": "*녹기금 : 화자의 외로움을 해소해 보려는 매개체"}, {"original": "벽련화(碧蓮花) 한 곡조를 시름조ᄎᆞ 섯거 타니,", "translation": "벽련화 한 곡조를 시름조차 섞어 타니", "note": "*벽련화 : 거문고로 타는 노래의 제목"}, {"original": "소상 야우(瀟湘夜雨)의 댓소리 섯도ᄂᆞᆫ ᄃᆞᆺ,", "translation": "소상강 밤비에 댓잎 소리가 섞여 들리는 듯", "note": ""}, {"original": "화표(華表) 천년(千年)의 별학(別鶴)이 우니ᄂᆞᆫ ᄃᆞᆺ,", "translation": "망주석에 천 년 만에 찾아온 특별한 학이 울고 있는 듯", "note": "*화표 : 망주석(무덤 앞에 세우는 비석)"}, {"original": "옥수(玉手)의 타는 수단(手段) 녯 소ᄅᆡ 잇다마ᄂᆞᆫ", "translation": "아름다운 손으로 타는 솜씨는 옛 가락이 아직 있지만은", "note": ""}, {"original": "부용장(芙蓉帳) 적막(寂寞)ᄒᆞ니 뉘 귀에 들리소니,", "translation": "휘장 속이 적막하니 누구의 귀에 들릴 것인가?", "note": "*부용장 : 연꽃을 수놓은 휘장"}, {"original": "간장(肝腸)이 구곡(九曲) 되야 구븨구븨 ᄭᅳᆫ쳐서라.", "translation": "창자가 아홉 번 굽어 굽이굽이 끊어지는구나.", "note": ""}, {"original": "ᄎᆞᆯ하리 잠을 드러 ᄭᅮᆷ의나 보려 ᄒᆞ니,", "translation": "차라리 잠에 들어 꿈에서나마 (임을) 보려 하니", "note": ""}, {"original": "바람의 디ᄂᆞᆫ 닢과 풀 속에 우는 즘생,", "translation": "바람에 지는 잎과 풀 속에서 우는 벌레는", "note": "*닢, 즘생 : 잠을 깨워, 꿈에서 임을 만나는 것을 방해하는 방해물"}, {"original": "므스 일 원수로서 잠조차 ᄭᅢ오ᄂᆞᆫ다.", "translation": "무슨 일이 원수가 되어 잠마저 깨우는가?", "note": ""}, {"original": "천상(天上)의 견우 직녀(牽牛織女) 은하수(銀河水) 막혀서도,", "translation": "천상의 견우 직녀는 은하수로 가로막혔을지라도", "note": "*견우직녀 : 화자의 처지와 대조되는 소재"}, {"original": "칠월 칠석(七月七夕) 일년 일도(一年一度) 실기(失期)치 아니커든,", "translation": "칠월 칠석 일 년에 한 번은 때를 놓지지 않거늘", "note": "*실기 : 때를 놓치다"}, {"original": "우리 님 가신 후는 무슨 약수(弱水) ᄀᆞ렷관ᄃᆡ,", "translation": "우리 임 가신 후는 무슨 장애물이 가렸길래", "note": "*약수 : 깃털조차 가라앉아 절대로 건널 수 없다는 전설상의 강"}, {"original": "오거니 가거나 소식(消息)조차 ᄭᅳ쳤는고.", "translation": "오고 가는 소식마저 끊어졌는가?", "note": ""}, {"original": "난간(欄干)의 비겨 셔서 님 가신 ᄃᆡ ᄇᆞ라보니,", "translation": "난간에 기대어 서서 임 가신 데를 바라보니", "note": ""}, {"original": "초로(草露)는 맷쳐 잇고 모운(暮雲)이 지나갈 제,", "translation": "풀에 이슬은 맺혀 있고 저녁 구름이 지나갈 때", "note": ""}, {"original": "죽림(竹林) 푸른 고ᄃᆡ 새 소리 더욱 셟다.", "translation": "대나무숲 푸른 곳에 새소리가 더욱 서럽구나.", "note": "*새 : 감정이입의 소재"}, {"original": "세상의 셜운 사람 수 업다 ᄒᆞ려니와,", "translation": "세상에 서러운 사람 수없이 많다고 하겠지만", "note": ""}, {"original": "박명(薄命)한 홍안(紅顔)이야 날 가ᄐᆞ니 ᄯᅩ 이실가.", "translation": "운명이 기구한 여자는 나 같은 이가 또 있을까?", "note": "*홍안 : 붉은 얼굴이라는 뜻으로, 보통 '여자의 얼굴'을 가리킴."}, {"original": "아마도 이 님의 지위로 살동말동 ᄒᆞ여라.", "translation": "아마도 임의 탓으로 살 듯 말 듯 하구나.", "note": "*지위로 : 탓으로"}];
let index=0;
const $=id=>document.getElementById(id);
function show(){
 const x=lines[index];$('count').textContent=`${index+1} / ${lines.length}`;$('bar').style.width=`${(index+1)/lines.length*100}%`;
 $('original').textContent=x.original;$('translation').textContent=x.translation;
 $('note').textContent=x.note||'';$('note').hidden=!x.note;
 $('answer').hidden=true;$('reveal').hidden=false;
 $('prev').disabled=index===0;$('next').disabled=index===lines.length-1;
}
function move(n){let k=index+n;if(k>=0&&k<lines.length){index=k;show()}}
$('reveal').onclick=()=>{$('answer').hidden=false;$('reveal').hidden=true};
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '&&$('answer').hidden){e.preventDefault();$('reveal').click()}});
let startX=0,startY=0;document.querySelector('.panel').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});
document.querySelector('.panel').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)move(dx<0?1:-1)},{passive:true});
show();
</script></body></html>
